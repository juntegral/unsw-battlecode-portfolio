<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>g5 Wave Timeline</title>
<style>
:root {
  color-scheme: light;
  --font-sans: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Segoe UI", sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --bg: #ebeae6; --surface: #ffffff; --inset: #f6f5f2; --lane: #f6f5f2;
  --border: #d3d1ca; --border-strong: #a9a79f; --rail: #a9a79f; --track: #e4e3de;
  --text: #171715; --text-2: #4a4945; --text-3: #62615b;
  --good: #0a6b0a; --good-bg: #e3f1e3; --bad: #ad2626; --bad-bg: #fbe6e6;
  --warn: #855600; --warn-bg: #fcefd0; --run: #1b56a0; --run-bg: #e2ecf9; --idle: #4a4945; --idle-bg: #ebeae6;
  --good-mark: #3f9a3f; --bad-mark: #d05a5a; --warn-mark: #a8740c; --run-mark: #3f7fd0;
  --focus: #1b56a0;
  --shadow: 0 1px 2px rgba(23,23,21,.06), 0 2px 8px rgba(23,23,21,.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0f0f0e; --surface: #1c1c1a; --inset: #242422; --lane: #242422;
    --border: #45443f; --border-strong: #6a6962; --rail: #6a6962; --track: #2e2e2b;
    --text: #ecebe6; --text-2: #c4c3ba; --text-3: #a3a299;
    --good: #7cc47c; --good-bg: #1a2e1a; --bad: #ec9a9a; --bad-bg: #3a1f1f;
    --warn: #e2b560; --warn-bg: #33290f; --run: #94bced; --run-bg: #172538; --idle: #c4c3ba; --idle-bg: #2a2a27;
    --good-mark: #5fae5f; --bad-mark: #d07474; --warn-mark: #c79a3e; --run-mark: #5d95dc;
    --focus: #94bced; --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f0f0e; --surface: #1c1c1a; --inset: #242422; --lane: #242422;
  --border: #45443f; --border-strong: #6a6962; --rail: #6a6962; --track: #2e2e2b;
  --text: #ecebe6; --text-2: #c4c3ba; --text-3: #a3a299;
  --good: #7cc47c; --good-bg: #1a2e1a; --bad: #ec9a9a; --bad-bg: #3a1f1f;
  --warn: #e2b560; --warn-bg: #33290f; --run: #94bced; --run-bg: #172538; --idle: #c4c3ba; --idle-bg: #2a2a27;
  --good-mark: #5fae5f; --bad-mark: #d07474; --warn-mark: #c79a3e; --run-mark: #5d95dc;
  --focus: #94bced; --shadow: none;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 1rem/1.5 var(--font-sans); font-variant-numeric: tabular-nums; }
a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
a:hover { color: var(--run); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
code, .mono { font-family: var(--font-mono); font-size: max(13px, .92em); overflow-wrap: anywhere; }
code { background: var(--inset); padding: 0 4px; border-radius: 4px; }
.panel code { background: var(--surface); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.prose { max-inline-size: 68ch; word-break: keep-all; overflow-wrap: anywhere; line-break: strict; text-wrap: pretty; }
.clamp { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; word-break: keep-all; overflow-wrap: anywhere; }
.c1 { -webkit-line-clamp: 1; } .c2 { -webkit-line-clamp: 2; } .c3 { -webkit-line-clamp: 3; }
.t2 { color: var(--text-2); } .t3 { color: var(--text-3); }
.small { font-size: .875rem; line-height: 1.4; } .label { font-size: .8125rem; line-height: 1.4; font-weight: 500; color: var(--text-3); }
svg.i { width: 12px; height: 12px; flex: none; vertical-align: -1px; }

/* header */
.top { max-inline-size: 1440px; margin: 0 auto; padding: 16px 16px 12px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; min-block-size: 56px; }
.top h1 { margin: 0; font-size: 1.125rem; line-height: 1.3; font-weight: 600; text-wrap: balance; }
.top .meta { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: .8125rem; color: var(--text-3); }
button, .seg-btn { font: 500 .8125rem/1 var(--font-sans); color: var(--text); background: var(--surface); border: 1px solid var(--border-strong); border-radius: 8px; min-block-size: 32px; padding: 0 12px; cursor: pointer; }
@media (pointer: coarse) { button, .seg-btn, details > summary { min-block-size: 44px; } }
#alert { max-inline-size: 1440px; margin: 0 auto 8px; padding: 0 16px; }
#alert .box { background: var(--warn-bg); border-inline-start: 3px solid var(--warn-mark); border-radius: 8px; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
#alert .box b { display: block; font-weight: 600; }
#alert .box p { margin: 2px 0 0; font-size: .875rem; color: var(--text-2); }

/* board grid */
#board { max-inline-size: 1440px; margin: 0 auto; padding: 0 16px 24px; display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr);
  grid-template-areas: "n5" "flow" "hh" "t5" "pol"; }
#n-g5 { grid-area: n5; } #flow { grid-area: flow; } #hist-head { grid-area: hh; }
#t-g5 { grid-area: t5; } #policy { grid-area: pol; }
@media (min-width: 720px) {
  #board { padding: 0 24px 32px; }
  .top, #alert { padding-inline: 24px; }
}
@media (min-width: 1024px) { #board { column-gap: 24px; } }
@media (min-width: 1240px) {
  #board { padding: 0 32px 40px; gap: 24px; }
  .top, #alert { padding-inline: 32px; }
}
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); min-width: 0; }

/* pills, chips, tags */
.pill { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 6px; border-radius: 999px; font-size: .8125rem; font-weight: 600; line-height: 1; white-space: nowrap; border: 1px solid transparent; }
.o-adopt { color: var(--good); background: var(--good-bg); } .o-reject { color: var(--bad); background: var(--bad-bg); }
.o-incomplete, .o-unknown, .s-stopping, .s-stale-lock { color: var(--warn); background: var(--warn-bg); }
.o-running, .s-running { color: var(--run); background: var(--run-bg); }
.s-queued { color: var(--run); background: transparent; border-color: var(--run); }
.s-stopped, .s-missing, .s-unknown { color: var(--idle); background: var(--idle-bg); }
.chip { display: inline-flex; align-items: center; gap: 3px; padding: 0 8px; min-height: 22px; border-radius: 6px; font-size: .8125rem; font-weight: 600; white-space: nowrap; }
.chip.up { color: var(--good); background: var(--good-bg); } .chip.down { color: var(--bad); background: var(--bad-bg); } .chip.flat, .chip.na { color: var(--text-2); background: var(--inset); }
.chip .nm { font-weight: 500; color: inherit; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { display: inline-block; padding: 0 6px; border: 1px solid var(--border-strong); border-radius: 6px; font-size: .8125rem; font-weight: 500; color: var(--text-2); line-height: 1.5; white-space: nowrap; }
.dl { font-weight: 600; white-space: nowrap; } .dl.up { color: var(--good); } .dl.down { color: var(--bad); } .dl.flat { color: var(--text-2); } .dl.na { color: var(--text-3); font-weight: 400; }
.warnline { color: var(--warn); font-size: .8125rem; display: flex; gap: 4px; align-items: center; }

/* now card */
.now-card { container: now / inline-size; display: flex; flex-direction: column; }
.now-head { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.row-a { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row-a h2 { margin: 0; font-size: 1.5rem; line-height: 1.2; font-weight: 700; text-wrap: balance; }
.kv { display: grid; grid-template-columns: auto 1fr 1fr; gap: 12px 24px; margin: 0; }
.kv dt { font-size: .8125rem; font-weight: 500; color: var(--text-3); }
.kv dd { margin: 2px 0 0; }
.kv .big { font-size: 2rem; line-height: 1.1; font-weight: 700; font-variant-numeric: proportional-nums; }
.kv .mid { font-size: 1.25rem; line-height: 1.2; font-weight: 700; }
.kv .mid.time { font-weight: 600; display: inline-block; min-inline-size: 7.5em; }
.kv .sub { display: block; font-size: .8125rem; color: var(--text-3); margin-top: 2px; }
.growth-line { font-size: .875rem; line-height: 1.5; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.growth-line .gen { font-weight: 600; }
.crit-line { font-size: .875rem; line-height: 1.5; color: var(--text-2); display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; }
.crit-line .clamp { flex: 1; }
.crit-line .why { white-space: nowrap; font-size: .8125rem; }
.lbl { font-size: .8125rem; font-weight: 600; color: var(--text-3); margin-inline-end: 4px; }
.after { font-size: .875rem; color: var(--text-2); }
.pinned { border-top: 1px solid var(--border); padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.pinned.live { box-shadow: inset 3px 0 0 var(--run-mark); }
.pin-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.pin-h h3 { margin: 0; font-size: .8125rem; font-weight: 600; color: var(--text-3); }
.elapsed { font-size: 1.125rem; font-weight: 600; min-inline-size: 7.5em; text-align: end; }
.wave-line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.wave-line .wid { font-size: 1.5rem; font-weight: 700; line-height: 1.2; }
.wave-line .togen { margin-inline-start: auto; font-size: .875rem; font-weight: 600; color: var(--text-2); }
.stepper { display: flex; gap: 6px; list-style: none; margin: 0; padding: 0; font-size: .8125rem; color: var(--text-3); align-items: center; flex-wrap: wrap; }
.stepper li[aria-current] { color: var(--run); font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
.stepper li[aria-current]::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--run-mark); }
.status { font-size: .875rem; color: var(--text-2); }
.bar { height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--run-mark); border-radius: 3px; }
.hyp .stmt { font-size: 1rem; line-height: 1.45; }
.msg { border-inline-start: 2px solid var(--border-strong); padding-inline-start: 12px; font-size: .875rem; line-height: 1.55; color: var(--text-2); }
.callout { background: var(--surface); border: 1px solid var(--border-strong); border-inline-start: 3px solid var(--warn-mark); border-radius: 8px; padding: 8px 12px; font-size: .875rem; }
details > summary { list-style: none; }
details > summary::-webkit-details-marker { display: none; }
.disc > summary::before, .pol > summary::before { content: ""; width: 0; height: 0; border-style: solid; border-width: 5px 0 5px 7px; border-color: transparent transparent transparent currentColor; flex: none; transition: transform .12s; }
.disc[open] > summary::before, .pol[open] > summary::before { transform: rotate(90deg); }
.pinned > details > summary, .disc > summary { font-size: .875rem; font-weight: 500; color: var(--text-2); cursor: pointer; min-block-size: 32px; display: flex; align-items: center; gap: 6px; }
@container now (max-width: 419px) {
  .now-head { padding: 16px; }
  .kv { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .kv .big { font-size: 1.75rem; } .kv .mid { font-size: 1rem; } .kv .mid.time { min-inline-size: 0; }
  .elapsed { min-inline-size: 0; }
  .pinned { padding: 16px; }
  .msg.clamp { -webkit-line-clamp: 2; }
}

/* flow band */
#flow { padding: 16px 20px; container: flow / inline-size; }
.flow-h { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 12px; }
.flow-h h2, #hist-head h2 { margin: 0; font-size: 1.125rem; font-weight: 600; }
.seg-ctl { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 8px; overflow: hidden; }
.seg-ctl button { border: 0; border-radius: 0; min-block-size: 30px; background: transparent; }
.seg-ctl button + button { border-inline-start: 1px solid var(--border-strong); }
.seg-ctl button[aria-pressed="true"] { color: var(--run); background: var(--run-bg); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .8125rem; color: var(--text-3); }
.legend span { display: inline-flex; align-items: center; gap: 4px; }
.sw { width: 14px; height: 10px; border-radius: 3px; display: inline-block; }
.plot { display: grid; grid-template-columns: 2.5rem minmax(0, 1fr); row-gap: 8px; }
.axis { position: relative; height: 20px; font-size: .8125rem; color: var(--text-3); }
.axis span { position: absolute; transform: translateX(-50%); white-space: nowrap; top: 0; }
.lane-l { font-size: .875rem; font-weight: 600; align-self: center; }
.lane { position: relative; height: 28px; background: var(--lane); border: 1px solid var(--border); border-radius: 4px; }
.seg { position: absolute; top: 2px; bottom: 2px; min-width: 3px; border-radius: 4px; border: 1px solid; display: flex; align-items: center; gap: 3px; padding: 0 4px; font-size: .8125rem; font-weight: 600; overflow: hidden; white-space: nowrap; text-decoration: none; }
.seg.adopt { background: var(--good-bg); border-color: var(--good-mark); color: var(--good); }
.seg.reject { background: var(--bad-bg); border-color: var(--bad-mark); color: var(--bad); }
.seg.incomplete { background: var(--warn-bg); border-color: var(--warn-mark); border-style: dashed; color: var(--warn); }
.seg.unknown { background: var(--idle-bg); border-color: var(--warn-mark); border-style: dotted; color: var(--warn); }
.seg.running { background: var(--run-bg); border-color: var(--run-mark); border-right-style: none; color: var(--run); border-top-right-radius: 0; border-bottom-right-radius: 0; }
.seg .d { font-weight: 500; }
.seg.lbl-none > *, .seg.lbl-short .d { display: none; }
.gap-l { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; justify-content: center; font-size: .8125rem; color: var(--text-3); overflow: hidden; white-space: nowrap; }
.nowline { position: absolute; top: -22px; bottom: 0; right: 0; border-right: 2px solid var(--run-mark); pointer-events: none; }
.nowline span { position: absolute; right: 4px; top: 0; font-size: .8125rem; color: var(--run); white-space: nowrap; }

/* history */
#hist-head { display: flex; flex-direction: column; gap: 6px; }
#hist-head .hh { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
#hist-head .key { font-size: .8125rem; color: var(--text-3); line-height: 1.5; word-break: keep-all; }
.tl { container: tl / inline-size; overflow: hidden; }
.tl-h { padding: 16px 16px 8px; display: flex; flex-direction: column; gap: 4px; }
.tl-h h2 { margin: 0; font-size: 1rem; font-weight: 600; }
.tl-h h2 .cnt { font-weight: 400; font-size: .875rem; color: var(--text-2); margin-inline-start: 6px; }
.colhead { display: none; padding: 8px 16px; border-bottom: 1px solid var(--border); font-size: .8125rem; font-weight: 500; color: var(--text-3); }
.entry { border-top: 1px solid var(--border); position: relative; }
.entries > .entry:first-child { border-top: 0; }
.rs, .colhead-g { display: grid; column-gap: 8px; row-gap: 4px; align-items: center;
  grid-template-columns: 20px auto minmax(0, 1fr) auto 16px;
  grid-template-areas: "rail out idgen dur chev" "rail txt txt txt txt" "rail chips chips meta meta" "rail crit crit crit crit"; }
.rs { padding: 12px 16px; cursor: pointer; list-style: none; color: inherit; text-decoration: none; }
.rs::-webkit-details-marker { display: none; }
details.row > summary { list-style: none; }
details.row[open] > .rs, .rs:hover { background: var(--inset); }
.c-rail { grid-area: rail; align-self: stretch; position: relative; }
.c-rail::before { content: ""; position: absolute; left: 9px; top: -12px; bottom: -12px; border-left: 2px solid var(--rail); }
.entries > .entry:first-child .c-rail::before { top: 50%; }
.c-rail svg { position: relative; display: block; margin-top: 4px; width: 20px; height: 20px; }
.c-id { grid-area: id; display: none; font-size: .875rem; font-weight: 600; color: var(--text-2); }
.c-out { grid-area: out; }
.c-gen { grid-area: gen; display: none; font-size: .875rem; }
.c-idgen { grid-area: idgen; font-size: .875rem; color: var(--text-2); min-width: 0; }
.c-win { grid-area: win; } .c-g { grid-area: g; } .c-surv { grid-area: surv; }
.c-win, .c-g, .c-surv { display: none; font-size: .875rem; text-align: end; }
.c-dur { grid-area: dur; font-size: .875rem; font-weight: 600; text-align: end; white-space: nowrap; }
.c-chev { grid-area: chev; color: var(--text-3); }
.c-chev svg { width: 16px; height: 16px; transition: transform .12s; display: block; }
details[open] > .rs .c-chev svg { transform: rotate(90deg); }
.c-txt { grid-area: txt; font-size: 1rem; line-height: 1.45; color: var(--text-2); min-width: 0; }
.c-txt .lead { font-weight: 600; color: var(--text); }
.c-chips { grid-area: chips; }
.c-meta { grid-area: meta; font-size: .8125rem; color: var(--text-3); text-align: end; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; align-self: start; }
.c-crit { grid-area: crit; font-size: .875rem; line-height: 1.45; color: var(--text-2); min-width: 0; }
.c-crit b { color: var(--text-2); }
.gen-r { font-weight: 600; } .gen-r.new { color: var(--good); } .gen-arrow { color: var(--text-3); }
.entry.quiet .c-txt { color: var(--text-2); }
.gap { display: grid; grid-template-columns: 20px 1fr; column-gap: 8px; padding: 0 16px; min-block-size: 28px; align-items: center; border-top: 1px solid var(--border); font-size: .8125rem; color: var(--text-3); }
.gap .rl { align-self: stretch; background: repeating-linear-gradient(to bottom, var(--rail) 0 4px, transparent 4px 8px) no-repeat 9px 0 / 2px 100%; }
.tl-f { border-top: 1px solid var(--border); padding: 12px 16px; }
.log { margin: 8px 0 0; padding: 0; list-style: none; font-family: var(--font-mono); font-size: 13px; line-height: 1.5; color: var(--text-2); white-space: pre-wrap; overflow-wrap: anywhere; }
.log .m-good { color: var(--good); } .log .m-bad { color: var(--bad); } .log .m-warn { color: var(--warn); }
@container tl (min-width: 520px) {
  .rs, .colhead-g { grid-template-columns: 20px 3rem 4.75rem 4.5rem 3rem 3.5rem 3rem minmax(0, 1fr) 6rem 16px;
    grid-template-areas: "rail id out gen win g surv . dur chev" "rail txt txt txt txt txt txt txt meta meta" "rail crit crit crit crit crit crit crit meta meta"; }
  .colhead { display: block; }
  .c-id, .c-gen, .c-win, .c-g, .c-surv { display: block; }
  .c-idgen, .c-chips { display: none; }
  .c-meta .narrow-only { display: none; }
}
@container tl (max-width: 519px) { .c-meta .wide-only { display: none; } .c-crit.clamp { -webkit-line-clamp: 2; } }

/* panel */
.panel { container: panel / inline-size; background: var(--inset); border-top: 1px solid var(--border); padding: 16px 20px 20px 44px; display: flex; flex-direction: column; gap: 20px; }
.panel section > h4 { margin: 0 0 8px; font-size: .8125rem; font-weight: 600; color: var(--text-3); }
.panel section > h5 { margin: 12px 0 6px; font-size: .875rem; font-weight: 600; }
.panel .prose, .panel p { font-size: 1rem; line-height: 1.65; margin: 0; }
.panel .cap { font-size: .8125rem; color: var(--text-3); margin: 6px 0 0; line-height: 1.5; }
.gates { display: grid; grid-template-columns: 1.25rem 11rem minmax(0, 1fr); gap: 0 8px; font-size: .875rem; color: var(--text-2); }
.gates > div { padding: 6px 0; border-bottom: 1px solid var(--border); display: contents; }
.gates .gi, .gates .gl, .gates .gv { padding: 6px 0; border-bottom: 1px solid var(--border); }
.gates .gl { font-weight: 500; }
.gi svg { width: 14px; height: 14px; }
.g-met { color: var(--good); } .g-unmet { color: var(--bad); } .g-diff { color: var(--warn); } .g-prog { color: var(--run); } .g-na { color: var(--text-3); }
.crit-dl { margin: 0; display: flex; flex-direction: column; gap: 10px; }
.crit-dl dt { font-size: .8125rem; font-weight: 600; color: var(--text-3); }
.crit-dl dd { margin: 2px 0 0; }
.ev { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .8125rem; color: var(--text-3); }
table.sum, table.bd, table.md { width: 100%; border-collapse: collapse; font-size: .875rem; line-height: 1.45; }
table.sum th, table.sum td, table.bd th, table.bd td, table.md th, table.md td { padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
table.sum th, table.bd th { font-size: .8125rem; font-weight: 500; color: var(--text-3); text-align: end; }
table.sum th:first-child, table.sum td:first-child, table.bd th:first-child, table.bd td:first-child { text-align: start; }

    '한 웨이브에서 채택은 한 번이다. 미완료는 채택·성장으로 세지 않는다.',
    '같은 후보·기준의 시드를 다시 뽑지 않는다.',
    '채택 때 러너가 리포트 유효성과 bot/ = 확인한 후보인지 검사하고 커밋·내보낸다.'].map(function (t) { return h('<li>{}</li>', t); }));
  return h('<section class="card" id="policy">{}</section>', disc('policy', '승격 공통 기준 · 시드 2 × 지도 10 × 상대 4 × 양 진영 = 버전당 160판 · 뚜렷하게 나을 때만 채택', body, 'pol'));
}
function footerHtml() {
  var terms = [['채택', '확인한 후보가 새 세대가 됨'], ['기각', '이전 최선보다 뚜렷하게 낫지 않아 버림'], ['중단', '결론 없이 끝남'], ['끊김', '결과 파일 없이 끝남(러너 없음)'],
    ['G', '가장 긴 용 길이의 판 평균'], ['확인 경기', '새 시드 160판으로 이전 최선과 비교'], ['공통 관문', '모든 웨이브에 같은 확인 조건'],
    ['결정 기준', '이 웨이브 NOTES의 미리 정한 규칙·틀렸다면·예측 중 첫 번째'], ['쉼·정지', '웨이브 사이 시간(누적에 넣지 않음)']];
  return h('<dl>{}</dl><p>15초마다 자동 갱신 · 읽기 전용 · 시각은 이 컴퓨터 기준</p>', terms.map(function (t) { return h('<dt>{}</dt><dd>{}</dd>', t[0], t[1]); }));
}
function view() {
  var g5 = data.lineages.filter(function (l) { return l.name === 'g5'; })[0] || { name: 'g5', state: 'missing' };
  return [nowCard(g5), flow(), histHead(), timeline(g5), policyCard()];
}

// ---- behaviour ----
var board = document.getElementById('board');
function header() {
  var fresh = document.getElementById('fresh'), stale = lastOk && Date.now() - lastOk > 45000;
  if (!data) return;
  fresh.innerHTML = part(stale ? h('<span class="pill o-incomplete">{} 갱신 멈춤 · {} 기준 데이터</span>', raw(SVG.alert), hms(new Date(lastOk))) : h('{} 기준', hms(new Date(lastOk))));
  var d = num(data.diskFreeGiB), disk = document.getElementById('disk');
  disk.innerHTML = part(d == null ? '' : d >= 25 ? h('디스크 {} GiB', d) : d >= 20 ? h('<span class="pill o-incomplete">디스크 {} GiB · 20 GiB 미만이면 새 경기 중단</span>', d) : h('<span class="pill o-reject">디스크 {} GiB · 새 경기 중단 수준</span>', d));
}
function render() {
  if (!data) return;
  var active = document.activeElement, focusKey = active && active.closest ? (active.closest('[data-key]') || {}).dataset : null;
  focusKey = focusKey ? focusKey.key : null;
  var y = window.scrollY;
  board.innerHTML = part(view());
  document.getElementById('foot').innerHTML = part(footerHtml());
  header();
  sizeFlow();
  window.scrollTo(0, y);
  if (focusKey) { var el = board.querySelector('[data-key="' + CSS.escape(focusKey) + '"] > summary'); if (el) el.focus({ preventScroll: true }); }
}
function sizeFlow() {
  var lane = board.querySelector('.lane');
  if (lane) {
    var w = lane.clientWidth;
    if (w && Math.abs(w - flowWidth) > 40) { flowWidth = w; var f = document.getElementById('flow'); if (f) { f.outerHTML = part(flow()); } }
  }
  board.querySelectorAll('.seg').forEach(function (s) { var w = s.offsetWidth; s.classList.toggle('lbl-none', w < 36); s.classList.toggle('lbl-short', w >= 36 && w < 90); });
}
function announce(prev, cur) {
  if (!prev) return;
  var msgs = [], changed = [];
  cur.lineages.forEach(function (l) {
    var pl = prev.lineages.filter(function (x) { return x.name === l.name; })[0]; if (!pl) return;
    var pw = {}; (pl.waves || []).forEach(function (w) { pw[w.id] = w; });
    (l.waves || []).forEach(function (w) {
      var o = pw[w.id];
      if (!o && w.running) { msgs.push(l.name + ' ' + short(w.id) + ' 시작'); changed.push(l.name + '-' + w.id); return; }
      if (!o) return;
      if (o.outcome !== w.outcome && w.outcome !== 'running') {
        msgs.push(l.name + ' ' + short(w.id) + ' ' + OUT_LABEL[w.outcome] + (w.outcome === 'adopt' && w.version ? ' — r' + w.readyBefore + ' → r' + w.version : ''));
        changed.push(l.name + '-' + w.id);
      } else if (w.running && o.running && phase(o) !== phase(w)) {
        msgs.push(l.name + ' ' + short(w.id) + (phase(w) === 'confirm' ? ' 확인 경기 시작' : ' 판정 단계')); changed.push(l.name + '-now');
      }
    });
    if (pl.state !== l.state && l.state === 'stopped') msgs.push(l.name + ' 루프 정지');
  });
  if (msgs.length) document.getElementById('announce').textContent = msgs.join('. ');
  changed.forEach(function (id) { var el = document.getElementById(id); if (el) { el.classList.add('flash'); setTimeout(function () { el.classList.remove('flash'); }, 900); } });
}
function showAlert(status) {
  var a = document.getElementById('alert');
  if (!status) { a.innerHTML = ''; return; }
  var body = status === 403 ? '접근 토큰이 필요합니다. operator-only/dashboard.url의 주소로 다시 여세요.'
    : status === -1 ? '데이터는 받았지만 화면을 그리지 못했습니다. 이전 화면을 유지합니다. 브라우저 콘솔 오류를 확인하세요.'
    : '화면은 ' + (lastOk ? hms(new Date(lastOk)) : '–') + ' 기준입니다. 서버가 꺼졌는지 확인하세요.';
  a.innerHTML = part(h('<div class="box"><div><b>새 데이터를 받지 못했습니다</b><p>{}</p></div><button type="button" id="retry">다시 시도</button></div>', body));
}
function load() {
  fetch('/api/state', { cache: 'no-store', credentials: 'same-origin' }).then(function (r) {
    if (!r.ok) { var e = new Error('HTTP ' + r.status); e.status = r.status; throw e; }
    return r.text();
  }).then(function (t) {
    var cmp = t.replace(/"at":"[^"]*",?/, '');
    if (cmp === lastText) { lastOk = Date.now(); showAlert(null); header(); return; }
    var next = JSON.parse(t), before = data;
    data = next;
    try { render(); } catch (err) { data = before; console.error(err); showAlert(-1); return; }
    lastText = cmp; lastOk = Date.now(); prevData = before; showAlert(null); header();
    announce(prevData, data);
    if (!prevData) deepLink();
  }).catch(function (e) { showAlert(e.status || -2); header(); });
}
// lazy panels: fill a row's panel when it opens
document.addEventListener('toggle', function (e) {
  var d = e.target; if (!d || !d.dataset || !d.dataset.key) return;
  if (d.open) openKeys.add(d.dataset.key); else openKeys.delete(d.dataset.key);
  saveOpen();
  if (d.open && d.classList.contains('row')) {
    var pnl = d.querySelector(':scope > .panel[data-lazy]');
    if (pnl && data) {
      var parts = d.dataset.key.split(':'), l = data.lineages.filter(function (x) { return x.name === parts[0]; })[0], w = l && l.waves.filter(function (x) { return x.id === parts[1]; })[0];
      if (w) { pnl.innerHTML = part(panel(w, l)); pnl.removeAttribute('data-lazy'); }
    }
  }
}, true);
document.addEventListener('click', function (e) {
  var b = e.target.closest && e.target.closest('button');
  if (!b) return;
  if (b.id === 'refresh' || b.id === 'retry') { lastText = ''; load(); }
  if (b.dataset.order) { order = b.dataset.order; try { localStorage.setItem('waveDash.order', order); } catch (x) {} render(); }
  if (b.dataset.span) { span = b.dataset.span; try { localStorage.setItem('waveDash.span', span); } catch (x) {} render(); }
});
function deepLink() {
  if (/^#g[345]-now$/.test(location.hash)) {
    if (location.hash !== '#g5-now') history.replaceState(null, '', '#g5-now');
    var now = document.getElementById('g5-now');
    if (now) now.scrollIntoView({ block: 'start' });
    return;
  }
  var m = location.hash.match(/^#(g\d+)-(w\d{6})(-p2)?$/);
  if (!m || !data) return;
  var key = m[1] + ':' + m[2] + ':row';
  if (!openKeys.has(key)) { openKeys.add(key); saveOpen(); render(); }
  var el = document.getElementById(m[1] + '-' + m[2] + (m[3] || '')) || document.getElementById(m[1] + '-' + m[2]);
  if (el) { el.scrollIntoView({ block: 'start' }); var s = document.getElementById(m[1] + '-' + m[2]); if (s && s.querySelector('summary')) s.querySelector('summary').focus({ preventScroll: true }); }
}
window.addEventListener('hashchange', deepLink);
var rz; window.addEventListener('resize', function () { clearTimeout(rz); rz = setTimeout(function () { if (data) sizeFlow(); }, 150); });
function tick() {
  document.querySelectorAll('[data-since]').forEach(function (el) {
    var s = el.getAttribute('data-since'); if (!s) return;
    var v = dur((+el.getAttribute('data-base-ms') || 0) + Date.now() - new Date(s));
    el.textContent = el.classList.contains('elapsed') ? v + ' 경과' : v;
  });
}
setInterval(tick, 1000);
setInterval(function () { document.querySelectorAll('[data-ago]').forEach(function (el) { el.textContent = ago(el.getAttribute('data-ago')); }); }, 15000);
setInterval(header, 5000);
setInterval(function () { if (data) { var f = document.getElementById('flow'); if (f) { f.outerHTML = part(flow()); sizeFlow(); } } }, 60000);
setInterval(load, 15000);
load();
</script>
